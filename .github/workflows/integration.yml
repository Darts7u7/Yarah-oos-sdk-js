name: Integration Tests (Manual)

on:
  workflow_dispatch:
    inputs:
      base-url:
        description: 'Yarah project URL (overrides repo variable)'
        required: false
        type: string
      test-filter:
        description: 'Filter tests by name (e.g. "auth", "database", "ai")'
        required: false
        type: string
  schedule:
    # Run daily at 06:00 UTC to catch regressions
    - cron: '0 6 * * *'

jobs:
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run integration tests
        run: |
          if [ -n "$TEST_FILTER" ]; then
            npx vitest run --config vitest.integration.config.ts -t "$TEST_FILTER"
          else
            npm run test:integration:ci
          fi
        env:
          YARAH_INTEGRATION_BASE_URL: ${{ inputs.base-url || vars.YARAH_INTEGRATION_BASE_URL }}
          YARAH_INTEGRATION_ANON_KEY: ${{ secrets.YARAH_INTEGRATION_ANON_KEY }}
          YARAH_INTEGRATION_TEST_EMAIL: ${{ secrets.YARAH_INTEGRATION_TEST_EMAIL }}
          YARAH_INTEGRATION_TEST_PASSWORD: ${{ secrets.YARAH_INTEGRATION_TEST_PASSWORD }}
          TEST_FILTER: ${{ inputs.test-filter }}
